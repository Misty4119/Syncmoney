import org.gradle.api.artifacts.ProjectDependency
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.testing.jacoco.tasks.JacocoReport
import java.nio.charset.StandardCharsets
import java.nio.file.Files
import java.util.zip.ZipFile

plugins {
    id 'java'
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.3.1'
    id 'com.gradleup.nmcp.aggregation' version '1.6.2'
    id 'com.gradleup.nmcp' version '1.6.2' apply false
    id 'xyz.jpenilla.run-paper' version '2.3.1'
}

group = 'noietime'
version = providers.gradleProperty('releaseVersion').orElse('1.3.2').get()

repositories {
    mavenCentral()
    maven { name = 'papermc'; url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { name = 'jitpack'; url = 'https://jitpack.io' }
    maven { name = 'spigotmc-repo'; url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { name = 'extendedclip'; url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { name = 'codemc-creatorfromhell'; url = 'https://repo.codemc.io/repository/creatorfromhell/' }
}

dependencies {
    implementation project(':syncmoney-bukkit')
    nmcpAggregation project(':syncmoney-api')
}

nmcpAggregation {
    centralPortal {
        // Validation must stop at a reviewable Portal deployment. The only enabled
        // upload path is the guarded tools/central-publisher client.
        publishingType = 'USER_MANAGED'
        validationTimeout = java.time.Duration.ofMinutes(15)
    }
}

allprojects {
    tasks.configureEach {
        String taskName = name.toLowerCase(java.util.Locale.ROOT)
        boolean portalPublisher =
                ((taskName.startsWith('publish') || taskName.startsWith('nmcppublish')) && taskName.contains('central')) ||
                        taskName == 'nmcppublishdeployment'
        if (portalPublisher) {
            enabled = false
        }
    }
}

tasks.register('verifyCentralPublisherIsolation') {
    group = 'verification'
    description = 'Verifies that no Gradle task can publish directly to a Central Portal repository.'
    doLast {
        def enabledPortalPublishTasks = allprojects.collectMany { project ->
            project.tasks.findAll { task ->
                String taskName = task.name.toLowerCase(java.util.Locale.ROOT)
                boolean portalPublisher =
                        ((taskName.startsWith('publish') || taskName.startsWith('nmcppublish')) && taskName.contains('central')) ||
                                taskName == 'nmcppublishdeployment'
                portalPublisher && task.enabled
            }
        }
        if (!enabledPortalPublishTasks.isEmpty()) {
            throw new GradleException(
                    "Central Portal publish tasks must remain disabled: ${enabledPortalPublishTasks.collect { it.path }.sort()}"
            )
        }
        logger.lifecycle('Central Portal publisher isolation verified; direct Portal publishing tasks are disabled.')
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.toVersion(25)
    targetCompatibility = JavaVersion.toVersion(25)
}

subprojects {
    plugins.withId('java') { apply plugin: 'jacoco' }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(25)
    }
}

evaluationDependsOn(':syncmoney-bukkit')
sourceSets {
    main {
        java.setSrcDirs([])
        resources.setSrcDirs([])
    }
    acceptance {
        compileClasspath += project(':syncmoney-bukkit').sourceSets.main.output + project(':syncmoney-bukkit').configurations.compileClasspath
    }
    apiConsumer {
        java.srcDir file('src/api-consumer/java')
        resources.srcDir file('src/api-consumer/resources')
    }
}

dependencies {
    apiConsumerCompileOnly project(':syncmoney-api')
    apiConsumerCompileOnly 'io.papermc.paper:paper-api:1.21.6-R0.1-SNAPSHOT'
}

tasks.named('test') {
    useJUnitPlatform()
    dependsOn subprojects.collect { it.path + ':test' }
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

gradle.projectsEvaluated {
    def javaProjects = subprojects.findAll { it.plugins.hasPlugin('java') }
    tasks.named('jacocoTestReport', JacocoReport) {
        dependsOn javaProjects.collect { it.tasks.named('test') }
        executionData.setFrom(javaProjects.collect { it.layout.buildDirectory.file('jacoco/test.exec') })
        classDirectories.setFrom(javaProjects.collect {
            it.extensions.getByName('sourceSets').main.output.classesDirs
        })
        sourceDirectories.setFrom(javaProjects.collect {
            it.extensions.getByName('sourceSets').main.allSource.srcDirs
        })
    }
}

tasks.register('apiConsumerJar', Jar) {
    dependsOn apiConsumerClasses
    archiveFileName = 'SyncmoneyApiConsumer.jar'
    destinationDirectory = layout.buildDirectory.dir('acceptance')
    from sourceSets.apiConsumer.output
}

tasks.register('acceptanceJar', Jar) {
    dependsOn acceptanceClasses, apiConsumerJar
    archiveFileName = 'SyncmoneyAcceptance.jar'
    destinationDirectory = layout.buildDirectory.dir('acceptance')
    from sourceSets.acceptance.output
}

tasks.register('preparePlugdev', Copy) {
    dependsOn tasks.named('shadowJar')
    from(tasks.named('shadowJar').flatMap { it.archiveFile })
    into(layout.buildDirectory.dir('plugdev'))
    rename { 'Syncmoney.jar' }
}

shadowJar {
    archiveFileName = "Syncmoney-${version}.jar"
    relocate('org.apache.commons', 'noietime.libs.apache.commons')
    relocate('com.zaxxer.hikari', 'noietime.libs.hikari')
    relocate('com.mysql', 'noietime.libs.mysql')
    relocate('org.postgresql', 'noietime.libs.postgresql')
    relocate('com.fasterxml.jackson', 'noietime.libs.jackson')
    relocate('com.google.gson', 'noietime.libs.gson')
    relocate('redis.clients.jedis', 'noietime.libs.jedis')
    relocate('org.bstats', 'noietime.libs.bstats')
    relocate('io.undertow', 'noietime.libs.undertow')
    relocate('io.undertow.websockets', 'noietime.libs.undertow.websockets')
    relocate('org.xnio', 'noietime.libs.xnio')
    relocate('org.jboss.threads', 'noietime.libs.jboss.threads')
    relocate('org.jboss.logging', 'noietime.libs.jboss.logging')
    relocate('org.yaml.snakeyaml', 'noietime.libs.snakeyaml')
    mergeServiceFiles()
}

tasks {
    runServer { minecraftVersion('1.21.6') }
    build { dependsOn tasks.named('shadowJar') }
}

tasks.register('verifyArchitecture') {
    group = 'verification'
    description = 'Checks the 1.4 module graph and compiled production boundaries.'
    dependsOn tasks.named('classes')
    dependsOn ':syncmoney-core:verifyArchitecture'
    dependsOn subprojects.collect { it.path + ':classes' }

    doLast {
        def failures = []
        def directProjectPaths = { projectToCheck ->
            ['api', 'implementation', 'compileOnly'].collectMany { configurationName ->
                def configuration = projectToCheck.configurations.findByName(configurationName)
                configuration == null ? [] : configuration.dependencies
                        .withType(ProjectDependency).collect { it.path }
            }.toSet()
        }
        def expectedProjects = [
                ':syncmoney-api'           : [] as Set,
                ':syncmoney-core'          : [':syncmoney-api'] as Set,
                ':syncmoney-protocol'      : [] as Set,
                ':syncmoney-storage'       : [':syncmoney-core'] as Set,
                ':syncmoney-sync'          : [':syncmoney-core', ':syncmoney-protocol'] as Set,
                ':syncmoney-bukkit'        : [':syncmoney-api', ':syncmoney-core', ':syncmoney-protocol',
                                              ':syncmoney-storage', ':syncmoney-sync'] as Set,
                ':syncmoney-papi-expansion': [] as Set,
                ':syncmoney-testkit'       : [] as Set,
                ':syncmoney-benchmarks'    : [] as Set,
        ]
        expectedProjects.each { path, expected ->
            def actual = directProjectPaths(project(path))
            if (actual != expected) {
                failures << path + ' direct project dependencies expected ' + expected.sort() + ', got ' + actual.sort()
            }
        }
        def rootDependencies = directProjectPaths(project)
        if (rootDependencies != [':syncmoney-bukkit'] as Set) {
            failures << 'root direct project dependencies must be only syncmoney-bukkit, got ' + rootDependencies
        }
        def expectedResolvedProjects = [
                ':syncmoney-api'           : [] as Set,
                ':syncmoney-core'          : [':syncmoney-api'] as Set,
                ':syncmoney-protocol'      : [] as Set,
                ':syncmoney-storage'       : [':syncmoney-core', ':syncmoney-api'] as Set,
                ':syncmoney-sync'          : [':syncmoney-core', ':syncmoney-api', ':syncmoney-protocol'] as Set,
                ':syncmoney-bukkit'        : [':syncmoney-api', ':syncmoney-core', ':syncmoney-protocol',
                                              ':syncmoney-storage', ':syncmoney-sync'] as Set,
                ':syncmoney-papi-expansion': [] as Set,
                ':syncmoney-testkit'       : [] as Set,
                ':syncmoney-benchmarks'    : [] as Set,
        ]
        def paperApiExternalGroups = [
                'io.papermc.paper', 'com.google.guava', 'com.google.code.findbugs', 'org.checkerframework',
                'com.google.errorprone', 'com.google.j2objc', 'com.google.code.gson', 'org.yaml', 'org.joml',
                'it.unimi.dsi', 'org.apache.logging.log4j', 'org.slf4j', 'com.mojang', 'net.md-5',
                'org.apache.commons', 'org.apache.maven', 'org.codehaus.plexus', 'javax.inject', 'org.eclipse.sisu',
                'org.apache.maven.resolver', 'org.jspecify', 'net.kyori', 'org.jetbrains',
                'com.google.auto.service'
        ] as Set
        def allowedExternalGroups = [
                ':syncmoney-api'           : [] as Set,
                ':syncmoney-core'          : [] as Set,
                ':syncmoney-protocol'      : ['com.google.code.gson', 'com.google.errorprone'] as Set,
                ':syncmoney-storage'       : ['com.fasterxml.jackson', 'com.fasterxml.jackson.core'] as Set,
                ':syncmoney-sync'          : ['com.google.code.gson', 'com.google.errorprone'] as Set,
                ':syncmoney-bukkit'        : (paperApiExternalGroups + [
                        'net.milkbowl.vault', 'me.clip', 'redis.clients', 'org.apache.commons', 'org.json',
                        'com.zaxxer', 'com.mysql', 'com.google.protobuf', 'org.postgresql', 'org.xerial',
                        'com.fasterxml.jackson.core', 'com.fasterxml.jackson', 'org.bstats', 'io.undertow',
                        'org.jboss.logging', 'org.jboss.xnio', 'org.wildfly.common', 'org.wildfly.client',
                        'org.jboss.threads', 'jakarta.servlet', 'jakarta.annotation', 'jakarta.websocket'
                ]) as Set,
                ':syncmoney-papi-expansion': (paperApiExternalGroups + [
                        'me.clip', 'com.zaxxer', 'com.mysql', 'com.google.protobuf', 'org.postgresql'
                ]) as Set,
                ':syncmoney-testkit'       : [] as Set,
                ':syncmoney-benchmarks'    : [] as Set,
        ]
        def runtimeForbiddenExternalGroups = [
                ':syncmoney-bukkit': ['io.papermc.paper', 'net.milkbowl.vault', 'me.clip', 'net.kyori'] as Set,
                ':syncmoney-papi-expansion': [
                        'io.papermc.paper', 'me.clip', 'net.kyori', 'com.zaxxer', 'com.mysql',
                        'com.google.protobuf', 'org.postgresql'
                ] as Set,
        ]
        expectedResolvedProjects.each { path, expected ->
            def module = project(path)
            ['compileClasspath', 'runtimeClasspath'].each { configurationName ->
                def configuration = module.configurations.findByName(configurationName)
                if (configuration == null || !configuration.canBeResolved) {
                    failures << path + ' is missing resolvable ' + configurationName
                } else {
                    def componentIds = configuration.incoming.resolutionResult.allComponents.collect { it.id }
                    def actualProjects = componentIds.findAll { it instanceof ProjectComponentIdentifier }
                            .collect { it.projectPath }.findAll { it != path }.toSet()
                    if (actualProjects != expected) {
                        failures << path + ' resolved ' + configurationName + ' project dependencies expected ' +
                                expected.sort() + ', got ' + actualProjects.sort()
                    }
                    def actualExternalGroups = componentIds.findAll { it instanceof ModuleComponentIdentifier }
                            .collect { it.group }.toSet()
                    def unexpectedGroups = actualExternalGroups - allowedExternalGroups[path]
                    if (!unexpectedGroups.isEmpty()) {
                        failures << path + ' resolved ' + configurationName + ' unexpected external groups ' +
                                unexpectedGroups.sort()
                    }
                    def runtimeForbidden = runtimeForbiddenExternalGroups[path] ?: [] as Set
                    if (configurationName == 'runtimeClasspath') {
                        def leakedServerGroups = actualExternalGroups.intersect(runtimeForbidden)
                        if (!leakedServerGroups.isEmpty()) {
                            failures << path + ' runtimeClasspath contains provided/compile-only groups ' +
                                    leakedServerGroups.sort()
                        }
                    }
                }
            }
        }
        def rootSources = fileTree('src/main/java').matching { include '**/*.java' }.files
        if (!rootSources.isEmpty()) {
            failures << 'root still owns production Java files: ' + rootSources.size()
        }
        if (!file('src/main/resources/plugin.yml').isFile()) {
            failures << 'canonical plugin resources are missing from root src/main/resources'
        }
        def bukkitResources = project(':syncmoney-bukkit').extensions.getByName('sourceSets')
                .main.resources.srcDirs.collect { it.canonicalFile }
        if (!bukkitResources.contains(file('src/main/resources').canonicalFile)) {
            failures << 'syncmoney-bukkit does not process the canonical root resources'
        }

        def forbiddenByModule = [
                ':syncmoney-api': [
                        'org/bukkit/', 'io/papermc/paper/', 'net/milkbowl/vault/',
                        'me/clip/placeholderapi/', 'com/zrips/cmi/', 'redis/clients/jedis/',
                        'java/sql/', 'javax/sql/', 'com/zaxxer/hikari/', 'io/undertow/',
                        'com/google/gson/', 'com/fasterxml/jackson/'
                ],
                ':syncmoney-protocol': [
                        'org/bukkit/', 'io/papermc/paper/', 'net/milkbowl/vault/',
                        'me/clip/placeholderapi/', 'com/zrips/cmi/', 'redis/clients/jedis/',
                        'java/sql/', 'javax/sql/', 'com/zaxxer/hikari/', 'io/undertow/'
                ],
                ':syncmoney-storage': [
                        'org/bukkit/', 'io/papermc/paper/', 'net/milkbowl/vault/',
                        'me/clip/placeholderapi/', 'com/zrips/cmi/', 'redis/clients/jedis/',
                        'com/zaxxer/hikari/', 'io/undertow/'
                ],
                ':syncmoney-sync': [
                        'org/bukkit/', 'io/papermc/paper/', 'net/milkbowl/vault/',
                        'me/clip/placeholderapi/', 'com/zrips/cmi/', 'redis/clients/jedis/',
                        'java/sql/', 'javax/sql/', 'com/zaxxer/hikari/', 'io/undertow/'
                ]
        ]
        forbiddenByModule.each { path, forbiddenTokens ->
            def mainOutput = project(path).extensions.getByName('sourceSets').main.output
            mainOutput.classesDirs.files.each { classRoot ->
                if (classRoot.exists()) {
                    def paths = Files.walk(classRoot.toPath())
                    try {
                        paths.filter { Files.isRegularFile(it) && it.toString().endsWith('.class') }
                                .forEach { classFile ->
                                    def bytecode = new String(Files.readAllBytes(classFile), StandardCharsets.ISO_8859_1)
                                    forbiddenTokens.each { token ->
                                        if (bytecode.contains(token)) {
                                            failures << path + ' bytecode ' + classFile + ' references forbidden ' + token
                                        }
                                    }
                                }
                    } finally {
                        paths.close()
                    }
                }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('Architecture verification failed:\n - ' + failures.join('\n - '))
        }
        logger.lifecycle('Architecture verification passed: expected module edges, resolved dependency boundaries, empty root sources, canonical resource ownership, and pure-module bytecode boundaries are valid.')
    }
}

tasks.register('verifyPackaging') {
    group = 'verification'
    description = 'Checks the assembled Syncmoney plugin JAR for legacy resources, unique classes, and runtime boundaries.'
    dependsOn tasks.named('shadowJar')

    doLast {
        def artifact = tasks.named('shadowJar').get().archiveFile.get().asFile
        def failures = []
        if (!artifact.isFile()) {
            throw new GradleException('Missing assembled artifact: ' + artifact)
        }
        ZipFile archive = new ZipFile(artifact)
        try {
            def counts = [:].withDefault { 0 }
            def entries = archive.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                counts[entry.name] = counts[entry.name] + 1
            }

            def classEntries = counts.findAll { name, count -> name.endsWith('.class') }
            def duplicateClasses = classEntries.findAll { name, count -> count > 1 }
            if (!duplicateClasses.isEmpty()) {
                failures << 'duplicate classes: ' + duplicateClasses.keySet().sort()
            }

            def requiredEntries = [
                    'plugin.yml', 'paper-plugin.yml', 'config.yml', 'messages.yml', 'alias.yml',
                    'database/migration.sql', 'noietime/syncmoney/Syncmoney.class',
                    'lua/atomic_add_balance.lua', 'lua/atomic_audit.lua',
                    'lua/atomic_bank_deposit.lua', 'lua/atomic_bank_transfer.lua',
                    'lua/atomic_bank_withdraw.lua', 'lua/atomic_plugin_transfer.lua',
                    'lua/atomic_set_balance.lua', 'lua/atomic_transfer.lua',
                    'syncmoney-web/dist/index.html', 'META-INF/services/java.sql.Driver',
                    'org/sqlite/JDBC.class', 'noietime/libs/gson/Gson.class',
                    'org/sqlite/native/Windows/x86_64/sqlitejdbc.dll'
            ]
            requiredEntries.each { name ->
                if (counts[name] != 1) {
                    failures << 'required entry ' + name + ' appears ' + counts[name] + ' times'
                }
            }

            [
                    'noietime/syncmoney/api/BalanceSnapshot.class',
                    'noietime/syncmoney/api/EconomyService.class',
                    'noietime/syncmoney/api/SyncmoneyApi.class'
            ].each { name ->
                if (counts[name] != 1) {
                    failures << 'public API class ' + name + ' appears ' + counts[name] + ' times'
                }
            }
            if (classEntries.keySet().any { it.startsWith('noietime/libs/syncmoney/api/') }) {
                failures << 'public API classes were relocated'
            }

            def forbiddenPrefixes = [
                    'org/bukkit/', 'io/papermc/paper/', 'com/destroystokyo/paper/',
                    'net/milkbowl/vault/', 'me/clip/placeholderapi/', 'com/zrips/cmi/',
                    'net/kyori/adventure/', 'noietime/syncmoney/testkit/',
                    'noietime/syncmoney/benchmark/', 'noietime/syncmoney/acceptance/',
                    'org/openjdk/jmh/'
            ]
            forbiddenPrefixes.each { prefix ->
                if (classEntries.keySet().any { it.startsWith(prefix) }) {
                    failures << 'server-provided or developer-only classes were packaged under ' + prefix
                }
            }
            def forbiddenFixtureResources = [
                    'protocol/legacy-balance-v1.json',
                    'protocol/legacy-cmi-v1.json',
                    'sql/legacy-local-sqlite-v1.3.2.sql'
            ] + counts.keySet().findAll { it.startsWith('compat/1.3.2/') }
            def leakedFixtureResources = forbiddenFixtureResources.findAll { counts.containsKey(it) }
            if (!leakedFixtureResources.isEmpty()) {
                failures << 'testkit compatibility fixture resources were packaged: ' + leakedFixtureResources.sort()
            }
            if (classEntries.keySet().any { it.startsWith('com/google/gson/') }) {
                failures << 'unrelocated Gson classes were packaged'
            }
            if (!counts.keySet().any { it.startsWith('org/sqlite/native/') }) {
                failures << 'SQLite native resources are missing'
            }

            def serviceEntry = archive.getEntry('META-INF/services/java.sql.Driver')
            if (serviceEntry != null) {
                def serviceText = new String(archive.getInputStream(serviceEntry).bytes, StandardCharsets.UTF_8)
                def providers = serviceText.readLines().collect { it.trim() }
                        .findAll { !it.isEmpty() && !it.startsWith('#') }
                if (providers.isEmpty()) {
                    failures << 'JDBC driver service file has no providers'
                }
                providers.each { provider ->
                    def classEntry = provider.replace('.', '/') + '.class'
                    if (counts[classEntry] != 1) {
                        failures << 'JDBC provider ' + provider + ' has ' + counts[classEntry] + ' matching class entries'
                    }
                }
            }

            def descriptor = new String(archive.getInputStream(archive.getEntry('plugin.yml')).bytes,
                    StandardCharsets.UTF_8)
            if (!descriptor.contains('main: noietime.syncmoney.Syncmoney')) {
                failures << 'plugin descriptor main class no longer points at the legacy Syncmoney FQCN'
            }
            if (!descriptor.contains("api-version: '1.21.6'")) {
                failures << 'plugin descriptor no longer requires the confirmed Paper 1.21.6 baseline'
            }

            classEntries.keySet().findAll { it.startsWith('noietime/syncmoney/') }.each { name ->
                def header = archive.getInputStream(archive.getEntry(name)).readNBytes(8)
                if (header.length != 8) {
                    failures << 'class ' + name + ' has a truncated classfile header'
                } else {
                    def major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                    if (major != 69) {
                        failures << 'application class ' + name + ' has classfile major ' + major + ', expected 69'
                    }
                }
            }

            def embeddedAssetCount = counts.keySet().count { it.startsWith('syncmoney-web/dist/') }
            if (embeddedAssetCount < 2) {
                failures << 'embedded web bundle has only ' + embeddedAssetCount + ' entries'
            }
        } finally {
            archive.close()
        }

        if (!failures.isEmpty()) {
            throw new GradleException('Packaging verification failed:\n - ' + failures.join('\n - '))
        }
        logger.lifecycle('Packaging verification passed for ' + artifact + ': unique classes, stable descriptors/resources, classfile major 69, unrelocated API, relocated Gson, and runtime-only server APIs.')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
}
