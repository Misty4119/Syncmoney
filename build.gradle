plugins {
    id 'java'
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.3.1'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = 'noietime'
// Stable releases keep the version in source control. Preview builds can override
// it from CI without committing an alpha/beta version to the repository.
version = providers.gradleProperty('releaseVersion').orElse('1.3.2').get()

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "extendedclip"
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }
    maven {
        name = "codemc-creatorfromhell"
        url = "https://repo.codemc.io/repository/creatorfromhell/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT")

    // VaultUnlockedAPI contains both the legacy Vault 1.7 contracts and the
    // modern net.milkbowl.vault2 API. The server runtime supplies these classes.
    compileOnly("net.milkbowl.vault:VaultUnlockedAPI:2.20")

    compileOnly("me.clip:placeholderapi:2.12.2")

    implementation("redis.clients:jedis:5.2.0")
    implementation("org.apache.commons:commons-pool2:2.12.1")
    implementation("com.zaxxer:HikariCP:6.2.1")
    implementation("com.mysql:mysql-connector-j:9.2.0")
    implementation("org.postgresql:postgresql:42.7.5")
    implementation("org.xerial:sqlite-jdbc:3.49.1.0")
    implementation("com.fasterxml.jackson.core:jackson-databind:2.17.2")
    // Paper, Folia and Canvas provide their matching native Adventure runtime.
    // Keeping these compile-only prevents a MiniMessage 4.x implementation from
    // being paired with a server Adventure 5.x API at runtime.
    compileOnly("net.kyori:adventure-text-minimessage:4.16.0")
    compileOnly("net.kyori:adventure-text-serializer-ansi:4.16.0")
    implementation("org.bstats:bstats-bukkit:3.1.0")

    implementation 'io.undertow:undertow-core:2.3.18.Final'
    implementation 'io.undertow:undertow-websockets-jsr:2.3.18.Final'
    implementation 'io.undertow:undertow-servlet:2.3.18.Final'

    // YAML configuration
    implementation 'org.yaml:snakeyaml:2.4'

    testImplementation("io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT")
    testImplementation("net.milkbowl.vault:VaultUnlockedAPI:2.20")
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    // The server supplies Adventure in production; tests need a concrete native-like runtime.
    testRuntimeOnly("net.kyori:adventure-text-minimessage:4.16.0")
    testRuntimeOnly("net.kyori:adventure-text-serializer-ansi:4.16.0")
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

shadowJar {
    archiveFileName = "Syncmoney-${version}.jar"
    
    dependencies {
    }
    
    relocate('org.apache.commons', 'noietime.libs.apache.commons')
    relocate('com.zaxxer.hikari', 'noietime.libs.hikari')
    relocate('com.mysql', 'noietime.libs.mysql')
    relocate('org.postgresql', 'noietime.libs.postgresql')
    relocate('com.fasterxml.jackson', 'noietime.libs.jackson')
    relocate('redis.clients.jedis', 'noietime.libs.jedis')
    relocate('org.bstats', 'noietime.libs.bstats')
    relocate('io.undertow', 'noietime.libs.undertow')
    relocate('io.undertow.websockets', 'noietime.libs.undertow.websockets')
    relocate('org.xnio', 'noietime.libs.xnio')
    relocate('org.jboss.threads', 'noietime.libs.jboss.threads')
    relocate('org.jboss.logging', 'noietime.libs.jboss.logging')
    relocate('org.yaml.snakeyaml', 'noietime.libs.snakeyaml')

    mergeServiceFiles()
}

tasks {
  runServer {
    minecraftVersion("1.20.4")
  }
  
  build {
    dependsOn shadowJar
  }
}

def targetJavaVersion = 21
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

// A separate acceptance plugin, never included in the distributable Syncmoney JAR.
sourceSets {
    acceptance {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
    }
}
tasks.register('acceptanceJar', Jar) {
    dependsOn acceptanceClasses
    archiveFileName = 'SyncmoneyAcceptance.jar'
    destinationDirectory = layout.buildDirectory.dir('acceptance')
    from sourceSets.acceptance.output
}
tasks.register('preparePlugdev', Copy) {
    dependsOn shadowJar
    from(tasks.shadowJar.archiveFile)
    into(layout.buildDirectory.dir('plugdev'))
    rename { 'Syncmoney.jar' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
    filesMatching('plugin.yml') {
        expand props
    }
    filesMatching('syncmoney-version.properties') {
        expand props
    }
    filesMatching('lua/*.lua') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }

    doLast {
        def webDir = file('src/main/resources/syncmoney-web')
        if (webDir.exists()) {
            copy {
                from webDir
                into 'build/resources/main/syncmoney-web'
            }
        }
    }
}
