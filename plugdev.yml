# External PlugDev CLI; generated server state stays in .plugdev/ (ignored).
type: plugin
server: paper
version: "1.20.4"
port: 25640
build:
  system: gradle
  task: preparePlugdev
  jarTask: preparePlugdev
  jarPattern: "build/plugdev/Syncmoney.jar"
client:
  launcher: none
  joinOnReady: false
jvm:
  memory: 1G
dev:
  onlineMode: false
  applySkins: false
  world: void
  peaceful: true
watch:
  reload:
    java: restart
run:
  cleanup: never
  autoStop: false
deps:
  - name: VaultUnlocked-2.20.0
    source: url
    url: https://github.com/TheNewEconomy/VaultUnlocked/releases/download/2.20.0/VaultUnlocked-2.20.0.jar
