plugins {
    id 'java-library'
}

group = rootProject.group
version = rootProject.version

def pairedJmhMeasurementProfile = [
        collector: 'SerialGC',
        gcJvmFlag: '-XX:+UseSerialGC',
        heapJvmFlag: '-Xmx1g',
        jmhJvmArgs: ['-XX:+UseSerialGC', '-Dnet.bytebuddy.experimental=true', '-Xmx1g']
]
def redisSqlMeasurementProfile = [
        collector: 'ParallelGC',
        gcJvmFlag: '-XX:+UseParallelGC'
]

repositories {
    mavenCentral()
    maven { name = 'papermc'; url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { name = 'codemc-creatorfromhell'; url = 'https://repo.codemc.io/repository/creatorfromhell/' }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.toVersion(25)
    targetCompatibility = JavaVersion.toVersion(25)
}

sourceSets {
    main {
        java.setSrcDirs([])
        resources.setSrcDirs([])
    }
    jmh {
        java.srcDir file('src/jmh/java')
        resources.srcDir file('src/jmh/resources')
    }
    loadTest {
        java.srcDir file('src/loadTest/java')
        resources.srcDir file('src/loadTest/resources')
    }
    test {
        compileClasspath += sourceSets.jmh.output
        compileClasspath += sourceSets.jmh.compileClasspath
        runtimeClasspath += sourceSets.jmh.runtimeClasspath
        compileClasspath += sourceSets.loadTest.output
        runtimeClasspath += sourceSets.loadTest.output
        resources.srcDir file('profiles')
    }
}

configurations {
    loadTestImplementation.extendsFrom(jmhImplementation)
    loadTestRuntimeOnly.extendsFrom(jmhRuntimeOnly)
}

dependencies {
    def paperApiVersion = rootProject.ext.paperApiVersion
    jmhImplementation project(':syncmoney-bukkit')
    jmhImplementation project(':syncmoney-protocol')
    jmhImplementation project(':syncmoney-storage')
    jmhImplementation "io.papermc.paper:paper-api:${paperApiVersion}"
    // Syncmoney extends JavaPlugin and implements VaultUnlocked's economy interface; the isolated mock event bus loads that type.
    jmhImplementation 'net.milkbowl.vault:VaultUnlockedAPI:2.20'
    jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
    jmhImplementation 'com.google.code.gson:gson:2.11.0'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
    jmhImplementation 'org.hdrhistogram:HdrHistogram:2.2.2'
    jmhImplementation 'redis.clients:jedis:8.0.2'
    jmhImplementation 'org.mockito:mockito-core:5.8.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation project(':syncmoney-storage')
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
}

tasks.named('test') {
    useJUnitPlatform()
    dependsOn tasks.named('loadTestClasses'), tasks.named('jmhClasses')
    jvmArgs '-Dnet.bytebuddy.experimental=true'
}

tasks.register('benchmarkJar', Jar) {
    group = 'benchmark'
    description = 'Builds the isolated JMH runner; this artifact is not a Syncmoney runtime plugin.'
    dependsOn tasks.named('jmhClasses')
    dependsOn configurations.jmhRuntimeClasspath.buildDependencies
    archiveFileName = 'SyncmoneyBenchmarks.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes('Main-Class': 'org.openjdk.jmh.Main')
    }
    from sourceSets.jmh.output
    from {
        configurations.jmhRuntimeClasspath.collect { dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }
}

tasks.register('verifyBenchmarkIsolation') {
    group = 'verification'
    description = 'Keeps JMH and HDR Histogram dependencies out of this module main runtime.'
    doLast {
        def mainGroups = configurations.runtimeClasspath.incoming.resolutionResult.allComponents
                .findAll { it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                .collect { it.id.group }
        def leaked = mainGroups.findAll { it == 'org.openjdk.jmh' || it == 'org.hdrhistogram' }
        if (!leaked.isEmpty()) {
            throw new GradleException('Benchmark-only dependencies leaked into main runtimeClasspath: ' + leaked.unique())
        }
        if (!sourceSets.main.allSource.isEmpty()) {
            throw new GradleException('Benchmark module main source set must remain empty and non-production.')
        }
    }
}

tasks.register('verifyBenchmarkJvmProfiles') {
    group = 'verification'
    description = 'Guards the paired JMH SerialGC profile and Redis/SQL ParallelGC profiles.'
    doLast {
        if (pairedJmhMeasurementProfile.collector != 'SerialGC'
                || pairedJmhMeasurementProfile.gcJvmFlag != '-XX:+UseSerialGC'
                || pairedJmhMeasurementProfile.heapJvmFlag != '-Xmx1g'
                || pairedJmhMeasurementProfile.jmhJvmArgs != [
                        '-XX:+UseSerialGC', '-Dnet.bytebuddy.experimental=true', '-Xmx1g']) {
            throw new GradleException('Paired JMH profile must remain the recorded benchmark-only SerialGC / 1 GiB profile.')
        }
        if (redisSqlMeasurementProfile.collector != 'ParallelGC'
                || redisSqlMeasurementProfile.gcJvmFlag != '-XX:+UseParallelGC') {
            throw new GradleException('Redis/SQL macro and open-loop profiles must retain ParallelGC.')
        }
        ['runBaselineMacroPilot', 'loadTest'].each { taskName ->
            List<String> configuredJvmArgs = tasks.named(taskName, JavaExec).get().jvmArgs ?: []
            if (configuredJvmArgs != [redisSqlMeasurementProfile.gcJvmFlag]) {
                throw new GradleException(taskName + ' must use the recorded Redis/SQL measurement JVM profile; got '
                        + configuredJvmArgs)
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyBenchmarkIsolation'), tasks.named('verifyBenchmarkJvmProfiles')
}

def runProcess = { List<String> command, File workingDirectory, Map<String, String> environment ->
    File capturedOutput = File.createTempFile('syncmoney-benchmark-process-', '.log')
    ProcessBuilder processBuilder = new ProcessBuilder(command)
            .directory(workingDirectory)
            .redirectErrorStream(true)
            .redirectOutput(capturedOutput)
    processBuilder.environment().putAll(environment)
    Process process = processBuilder.start()
    try {
        if (!process.waitFor(10, java.util.concurrent.TimeUnit.MINUTES)) {
            List<ProcessHandle> descendants = process.toHandle().descendants().toList()
            descendants.reverseEach { ProcessHandle child -> if (child.isAlive()) child.destroy() }
            process.destroy()
            boolean rootStopped = process.waitFor(2, java.util.concurrent.TimeUnit.SECONDS)
            boolean childStillAlive = descendants.any { ProcessHandle child -> child.isAlive() }
            if (!rootStopped || childStillAlive) {
                descendants.each { ProcessHandle child -> if (child.isAlive()) child.destroyForcibly() }
                if (process.isAlive()) process.destroyForcibly()
                process.waitFor(2, java.util.concurrent.TimeUnit.SECONDS)
                descendants.each { ProcessHandle child ->
                    if (child.isAlive()) {
                        try {
                            child.onExit().get(2, java.util.concurrent.TimeUnit.SECONDS)
                        } catch (java.util.concurrent.TimeoutException ignored) {
                            // The timeout below remains the primary failure; no unbounded wait here.
                        }
                    }
                }
            }
            throw new GradleException('Command timed out after 10 minutes: ' + command.first())
        }
        int exitCode = process.exitValue()
        String text = capturedOutput.getText('UTF-8').trim()
        if (exitCode != 0) {
            throw new GradleException('Command failed with exit code ' + exitCode + ': '
                    + command.first() + (text.isEmpty() ? '' : System.lineSeparator() + text))
        }
        text
    } catch (InterruptedException interrupted) {
        List<ProcessHandle> descendants = process.toHandle().descendants().toList()
        descendants.reverseEach { ProcessHandle child -> if (child.isAlive()) child.destroyForcibly() }
        process.destroyForcibly()
        process.waitFor(2, java.util.concurrent.TimeUnit.SECONDS)
        Thread.currentThread().interrupt()
        throw new GradleException('Interrupted while waiting for command: ' + command.first(), interrupted)
    } finally {
        capturedOutput.delete()
    }
}

def captureOutput = { List<String> command ->
    runProcess.call(command, rootProject.projectDir, [:]).trim()
}

def runJavaMain = { File executable, String classpath, String mainClass, List<String> mainArgs ->
    List<String> command = [executable.absolutePath, '-cp', classpath, mainClass] + mainArgs
    def output = providers.exec {
        commandLine command
        ignoreExitValue = true
    }
    int exitCode = output.result.get().exitValue
    if (exitCode != 0) {
        String stdout = output.standardOutput.asText.get()
        String stderr = output.standardError.asText.get()
        throw new GradleException("Java tool ${mainClass} failed with exit code ${exitCode}.\n${stdout}\n${stderr}")
    }
}

def captureHostCommand = { List<String> command ->
    Process process = new ProcessBuilder(command).start()
    try {
        if (!process.waitFor(5, java.util.concurrent.TimeUnit.SECONDS)) {
            process.destroyForcibly()
            process.waitFor(1, java.util.concurrent.TimeUnit.SECONDS)
            return null
        }
        String stdout = process.inputStream.getText('UTF-8').trim()
        String stderr = process.errorStream.getText('UTF-8').trim()
        process.exitValue() == 0 && stderr.isEmpty() && !stdout.isEmpty() ? stdout : null
    } catch (InterruptedException interrupted) {
        process.destroyForcibly()
        Thread.currentThread().interrupt()
        throw new GradleException('Interrupted while capturing benchmark host provenance.', interrupted)
    }
}

def capturePowerShell = { String script ->
    String encoded = java.util.Base64.encoder.encodeToString(
            script.getBytes(java.nio.charset.StandardCharsets.UTF_16LE))
    captureHostCommand.call(['powershell.exe', '-NoProfile', '-NonInteractive', '-EncodedCommand', encoded])
}

def captureHostProvenance = {
    def osBean = java.lang.management.ManagementFactory.getOperatingSystemMXBean()
    boolean windows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
    String cpuModel = System.getenv('PROCESSOR_IDENTIFIER')?.trim()
    if (windows) {
        String wmiCpuModel = capturePowerShell.call(
                '$ErrorActionPreference = \'Stop\'; $ProgressPreference = \'SilentlyContinue\'; '
                        + '[Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false); '
                        + '$model = (Get-CimInstance Win32_Processor | Select-Object -First 1 -ExpandProperty Name); '
                        + '[Console]::Out.Write($model)')
        if (wmiCpuModel != null && !wmiCpuModel.contains('\n') && !wmiCpuModel.contains('\r')) cpuModel = wmiCpuModel
    }
    if (cpuModel == null || cpuModel.isBlank() || cpuModel.length() > 256
            || cpuModel.contains('\n') || cpuModel.contains('\r')) cpuModel = 'NOT_CAPTURED'

    Object totalPhysicalMemoryBytes = 'NOT_CAPTURED'
    String totalPhysicalMemoryReason = null
    if (osBean instanceof com.sun.management.OperatingSystemMXBean) {
        long totalMemory = ((com.sun.management.OperatingSystemMXBean) osBean).getTotalMemorySize()
        if (totalMemory > 0L) totalPhysicalMemoryBytes = totalMemory
    }
    if (totalPhysicalMemoryBytes == 'NOT_CAPTURED') {
        totalPhysicalMemoryReason = 'The Java operating-system management bean did not expose physical memory.'
    }

    String activePowerPlan = windows
            ? captureHostCommand.call(['powercfg.exe', '/GETACTIVESCHEME'])
            : null
    def powerPlanGuidMatcher = activePowerPlan == null ? null
            : (activePowerPlan =~ /(?i)\b[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}\b/)
    String activePowerPlanGuid = powerPlanGuidMatcher != null && powerPlanGuidMatcher.find()
            ? powerPlanGuidMatcher.group().toLowerCase(Locale.ROOT) : null
    Map powerPlan = activePowerPlanGuid == null
            ? [status: 'NOT_CAPTURED', reason: 'The active OS power plan was not available through the host runner.']
            : [status: 'CAPTURED', value: activePowerPlanGuid]

    [osName: System.getProperty('os.name'), osVersion: System.getProperty('os.version'),
     osArch: System.getProperty('os.arch'), cpuModel: cpuModel,
     cpuModelReason: cpuModel == 'NOT_CAPTURED' ? 'No CPU model was available from the host environment.' : null,
     availableProcessors: Runtime.getRuntime().availableProcessors(),
     totalPhysicalMemoryBytes: totalPhysicalMemoryBytes,
     totalPhysicalMemoryReason: totalPhysicalMemoryReason,
     forkAffinity: [status: 'NOT_CAPTURED',
                    reason: 'The JMH fork affinity mask was not observed; no mask is inferred from its controller.'],
     powerPlan: powerPlan]
}

def sha256 = { File file ->
    java.security.MessageDigest digest = java.security.MessageDigest.getInstance('SHA-256')
    byte[] buffer = new byte[64 * 1024]
    file.withInputStream { input ->
        int read
        while ((read = input.read(buffer)) != -1) digest.update(buffer, 0, read)
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

def writeJsonAtomically = { File target, Object value ->
    target.parentFile.mkdirs()
    File temporary = new File(target.parentFile, target.name + '.tmp')
    java.nio.file.Files.writeString(temporary.toPath(),
            groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(value)) + System.lineSeparator(),
            java.nio.charset.StandardCharsets.UTF_8)
    try {
        java.nio.file.Files.move(temporary.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING,
                java.nio.file.StandardCopyOption.ATOMIC_MOVE)
    } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
        java.nio.file.Files.move(temporary.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

def recoveryEvidenceFor = { Map context, File resultFile, Object resultBytes, String resultSHA256 ->
    Map recovery = context.recoveryProvenance as Map
    if (recovery == null || recovery.type != 'POST_PROCESSING_ONLY' || recovery.measurementRerun != false
            || recovery.originalRunId != context.runId) {
        throw new GradleException('Recovery context must identify the same run and a post-processing-only recovery.')
    }
    if (!(recovery.originalLogSHA256 instanceof String)
            || !(recovery.originalLogSHA256 ==~ /[0-9a-f]{64}/)
            || !(recovery.originalValidationSummarySHA256 instanceof String)
            || !(recovery.originalValidationSummarySHA256 ==~ /[0-9a-f]{64}/)
            || !(recovery.sourceIdentityManifestSHA256 instanceof String)
            || !(recovery.sourceIdentityManifestSHA256 ==~ /[0-9a-f]{64}/)) {
        throw new GradleException('Recovery context is missing a valid digest for its original evidence.')
    }

    File originalLog = rootProject.file(recovery.originalLog as String).canonicalFile
    File originalExit = rootProject.file(recovery.originalExit as String).canonicalFile
    if (!originalLog.isFile() || sha256(originalLog) != recovery.originalLogSHA256
            || !originalExit.isFile() || (recovery.originalGradleExitCode as int) != 1
            || originalExit.text.trim() != (recovery.originalGradleExitCode as String)) {
        throw new GradleException('Recovery evidence does not bind the original failed Gradle log and exit code.')
    }
    String logText = originalLog.getText('UTF-8')
    int runCompleteAt = logText.indexOf('# Run complete.')
    int resultSavedAt = logText.indexOf('Benchmark result is saved to ' + resultFile.absolutePath)
    int heapFailureAt = logText.indexOf('Java heap space')
    int buildFailedAt = logText.lastIndexOf('BUILD FAILED')
    if (runCompleteAt < 0 || resultSavedAt <= runCompleteAt || heapFailureAt <= resultSavedAt
            || buildFailedAt <= heapFailureAt) {
        throw new GradleException('Original log does not establish a completed JMH report followed by Gradle post-processing failure.')
    }

    File originalSummary = rootProject.file(recovery.originalValidationSummary as String).canonicalFile
    if (!originalSummary.isFile() || sha256(originalSummary) != recovery.originalValidationSummarySHA256) {
        throw new GradleException('Recovery evidence does not bind the original validation summary.')
    }
    Map originalValidation = new groovy.json.JsonSlurper().parse(originalSummary) as Map
    if ((originalValidation.rowCount as int) != (context.expectedRows as int)
            || (originalValidation.expectedRows as int) != (context.expectedRows as int)
            || (originalValidation.sampleTimeRows as int) != ((context.expectedRows as int) / 2)) {
        throw new GradleException('Original validation summary does not attest the recovered report rows and bytes.')
    }
    boolean originalSummaryHasBytes = originalValidation.resultBytes != null
    boolean originalSummaryHasDigest = originalValidation.resultSHA256 != null
    if (!originalSummaryHasBytes || !originalSummaryHasDigest) {
        throw new GradleException('Original validation summary did not bind the exact report bytes; refusing recovery.')
    }
    if ((originalValidation.resultBytes as long) != (resultBytes as long)
            || originalValidation.resultSHA256 != resultSHA256) {
        throw new GradleException('Original validation summary has a mismatched report byte/hash binding.')
    }

    File recoveredSummary = file(context.validationSummaryFile as String).canonicalFile
    if (!recoveredSummary.isFile()) {
        throw new GradleException('Fresh recovery validation summary is missing: ' + recoveredSummary)
    }
    Map recoveredValidation = new groovy.json.JsonSlurper().parse(recoveredSummary) as Map
    if ((recoveredValidation.rowCount as int) != (context.expectedRows as int)
            || (recoveredValidation.expectedRows as int) != (context.expectedRows as int)
            || (recoveredValidation.sampleTimeRows as int) != ((context.expectedRows as int) / 2)
            || (recoveredValidation.resultBytes as long) != (resultBytes as long)
            || recoveredValidation.resultSHA256 != resultSHA256
            || recoveredValidation.comparisonType != context.comparisonType
            || recoveredValidation.variants != context.variants
            || (recoveredValidation.producerThreads as int) != (context.threadCount as int)
            || recoveredValidation.measurementJvmArgs != context.measurementJvmArgs) {
        throw new GradleException('Fresh recovery validation summary does not attest the exact report and paired context.')
    }

    File sourceIdentityManifest = rootProject.file(recovery.sourceIdentityManifest as String).canonicalFile
    if (!sourceIdentityManifest.isFile() || sha256(sourceIdentityManifest) != recovery.sourceIdentityManifestSHA256) {
        throw new GradleException('Recovery evidence does not bind its source identity manifest.')
    }
    Map sourceIdentity = new groovy.json.JsonSlurper().parse(sourceIdentityManifest) as Map
    if (sourceIdentity.sourceSHA != context.sourceSHA
            || sourceIdentity.sourceTreeSHA256 != context.sourceTreeSHA256
            || sourceIdentity.baselineSHA != context.baselineSHA
            || sourceIdentity.artifactSHA256?.benchmarkJar != recovery.benchmarkJarSHA256Observed
            || recovery.benchmarkJarSHA256Observed != context.artifactSHA256?.benchmarkJar
            || sourceIdentity.hostProvenance != context.hostProvenance) {
        throw new GradleException('Recovery source identity or inherited host facts do not match their bound t=2 manifest.')
    }

    [kind: 'RECOVERED_GRADLE_POST_PROCESSING_FAILURE',
     originalLog: recovery.originalLog,
     originalLogSHA256: recovery.originalLogSHA256,
     originalExit: recovery.originalExit,
     originalGradleExitCode: recovery.originalGradleExitCode,
     originalValidationSummary: recovery.originalValidationSummary,
     originalValidationSummarySHA256: recovery.originalValidationSummarySHA256,
     originalValidationSummaryHadReportBinding: originalSummaryHasBytes,
     sourceIdentityManifest: recovery.sourceIdentityManifest,
     sourceIdentityManifestSHA256: recovery.sourceIdentityManifestSHA256,
     benchmarkJarSHA256Observed: recovery.benchmarkJarSHA256Observed,
     recoveredValidationSummary: context.validationSummaryFile,
     recoveredValidationSummarySHA256: sha256(recoveredSummary),
     recoveredReportBytes: resultBytes,
     recoveredReportSHA256: resultSHA256]
}

def expectedMeasurementSuccessMarker = { Map context, File resultFile, Object resultBytes, String resultSHA256 ->
    boolean recovered = context.recoveryProvenance != null
    Map evidence = recovered
            ? recoveryEvidenceFor.call(context, resultFile, resultBytes, resultSHA256) as Map
            : [kind: 'GRADLE_JAVAEXEC_COMPLETED',
               description: 'The JMH JavaExec action returned successfully before Gradle post-processing.']
    [markerSchemaVersion: 1,
     measurementOutcome: recovered ? 'JMH_REPORT_RECOVERED_AFTER_POST_PROCESSING_FAILURE' : 'JAVAEXEC_EXIT_ZERO',
     runId: context.runId,
     sourceSHA: context.sourceSHA,
     sourceTreeSHA256: context.sourceTreeSHA256,
     resultFileRelativePath: context.resultFileRelativePath,
     resultBytes: resultBytes,
     resultSHA256: resultSHA256,
     evidence: evidence]
}

def validateFinalizationPaths = { Map context ->
    String contextPath = context.runContextFile as String
    if (contextPath == null || contextPath.isBlank()) {
        throw new GradleException('Paired run context is missing its run-context file path.')
    }
    File validatorJava = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }.get().executablePath.asFile
    runJavaMain.call(validatorJava, sourceSets.jmh.runtimeClasspath.asPath,
            'noietime.syncmoney.benchmark.PairedJmhReportValidator', [
                    'validate-finalization-paths', rootProject.projectDir.canonicalPath,
                    project.projectDir.canonicalPath,
                    file(contextPath).canonicalPath
            ])
}

def writeMeasurementSuccessMarker = { Map context ->
    validateFinalizationPaths.call(context)
    File resultFile = file(context.resultFile as String).canonicalFile
    if (!resultFile.isFile() || resultFile.length() == 0L) {
        throw new GradleException('JMH JavaExec completed without a non-empty result file: ' + resultFile)
    }
    String markerPath = context.measurementSuccessMarkerFile as String
    if (markerPath == null || markerPath.isBlank()) {
        throw new GradleException('Paired run context is missing its measurement success marker path.')
    }
    File markerFile = file(markerPath).canonicalFile
    Map expected = expectedMeasurementSuccessMarker.call(context, resultFile,
            resultFile.length(), sha256(resultFile)) as Map
    if (markerFile.isFile()) {
        Map existing = new groovy.json.JsonSlurper().parse(markerFile) as Map
        boolean exactMarkerMatch = groovy.json.JsonOutput.toJson(existing)
                == groovy.json.JsonOutput.toJson(expected)
        boolean safeRecoveryRefresh = false
        if (!exactMarkerMatch && context.recoveryProvenance != null) {
            Map oldEvidence = existing.evidence as Map
            Map newEvidence = expected.evidence as Map
            List<String> stableEvidenceFields = ['kind', 'originalLog', 'originalLogSHA256', 'originalExit',
                    'originalGradleExitCode', 'originalValidationSummary', 'originalValidationSummarySHA256',
                    'sourceIdentityManifest', 'sourceIdentityManifestSHA256', 'benchmarkJarSHA256Observed',
                    'recoveredReportBytes', 'recoveredReportSHA256']
            safeRecoveryRefresh = existing.markerSchemaVersion == expected.markerSchemaVersion
                    && existing.measurementOutcome == expected.measurementOutcome
                    && existing.runId == expected.runId
                    && existing.sourceSHA == expected.sourceSHA
                    && existing.sourceTreeSHA256 == expected.sourceTreeSHA256
                    && existing.resultFileRelativePath == expected.resultFileRelativePath
                    && (existing.resultBytes as long) == (expected.resultBytes as long)
                    && existing.resultSHA256 == expected.resultSHA256
                    && oldEvidence != null && newEvidence != null
                    && stableEvidenceFields.every { String key ->
                        groovy.json.JsonOutput.toJson(oldEvidence.get(key))
                                == groovy.json.JsonOutput.toJson(newEvidence.get(key))
                    }
                    && oldEvidence.recoveredValidationSummary instanceof String
                    && oldEvidence.recoveredValidationSummarySHA256 instanceof String
                    && (oldEvidence.recoveredValidationSummarySHA256 ==~ /[0-9a-f]{64}/)
        }
        if (!exactMarkerMatch && !safeRecoveryRefresh) {
            throw new GradleException('Existing paired measurement marker does not match its verified evidence; refusing overwrite.')
        }
        if (exactMarkerMatch) {
            logger.lifecycle('Paired measurement marker already exists and matches verified evidence: ' + markerFile)
            return
        }
        logger.lifecycle('Refreshing recovery marker metadata after revalidating the same immutable report and original failure evidence.')
    }
    writeJsonAtomically.call(markerFile, expected)
}

def recordMeasurementSuccess = { Map context ->
    if (context.recoveryProvenance != null) {
        throw new GradleException('Recovered reports must be finalized through the evidence-bound recovery path.')
    }
    writeMeasurementSuccessMarker.call(context)
}

def verifyMeasurementSuccessMarker = { Map context, File resultFile, Object resultBytes, String resultSHA256 ->
    String markerPath = context.measurementSuccessMarkerFile as String
    if (markerPath == null || markerPath.isBlank()) {
        throw new GradleException('Paired run context is missing its measurement success marker path.')
    }
    File markerFile = file(markerPath).canonicalFile
    if (!markerFile.isFile()) {
        throw new GradleException('Paired measurement success marker is missing: ' + markerFile)
    }
    Map actual = new groovy.json.JsonSlurper().parse(markerFile) as Map
    Map expected = expectedMeasurementSuccessMarker.call(context, resultFile, resultBytes, resultSHA256) as Map
    if (groovy.json.JsonOutput.toJson(actual) != groovy.json.JsonOutput.toJson(expected)) {
        throw new GradleException('Paired measurement marker does not match the run context, provenance, and exact report bytes.')
    }
}

def finalizeComparisonReport = { Map context ->
    validateFinalizationPaths.call(context)
    File resultFile = file(context.resultFile as String).canonicalFile
    File summaryFile = file(context.validationSummaryFile as String).canonicalFile
    File manifestFile = file(context.manifestFile as String).canonicalFile
    if (!resultFile.isFile() || resultFile.length() == 0L) {
        throw new GradleException('Paired JMH result JSON is missing or empty: ' + resultFile)
    }
    if (!(context.sourceSHA ==~ /[0-9a-f]{40}/)
            || !(context.sourceTreeSHA256 ==~ /[0-9a-f]{64}/)
            || !(context.baselineSHA ==~ /[0-9a-f]{40}/)) {
        throw new GradleException('Paired JMH run context has invalid source provenance hashes.')
    }
    long resultBytes = resultFile.length()
    String resultSHA256 = sha256(resultFile)

    File validatorJava = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }.get().executablePath.asFile
    runJavaMain.call(validatorJava, sourceSets.jmh.runtimeClasspath.asPath,
            'noietime.syncmoney.benchmark.PairedJmhReportValidator', [
                    'summarize', resultFile.absolutePath, summaryFile.absolutePath,
                    (context.variants as List<String>).join(','), context.operationFilter as String,
                    (context.quick as boolean).toString(), context.threadCount.toString(),
                    context.expectedForks.toString(), context.expectedMeasurementIterations.toString(),
                    context.p999SampleMinimum.toString()
            ])
    Map validationSummary = new groovy.json.JsonSlurper().parse(summaryFile) as Map
    int expectedRows = context.expectedRows as int
    if ((validationSummary.rowCount as int) != expectedRows
            || (validationSummary.expectedRows as int) != expectedRows
            || (validationSummary.sampleTimeRows as int) != (expectedRows / 2)
            || (validationSummary.producerThreads as int) != (context.threadCount as int)
            || validationSummary.variants != context.variants
            || validationSummary.comparisonType != context.comparisonType
            || validationSummary.measurementJvmArgs != context.measurementJvmArgs
            || !(validationSummary.measurementJdk as String).startsWith('25.')
            || !(validationSummary.resultSHA256 ==~ /[0-9a-f]{64}/)
            || validationSummary.resultSHA256 != resultSHA256
            || (validationSummary.resultBytes as long) != resultBytes) {
        throw new GradleException('Paired JMH validation summary does not match its persisted run context.')
    }
    if (context.recoveryProvenance != null) writeMeasurementSuccessMarker.call(context)
    verifyMeasurementSuccessMarker.call(context, resultFile, resultBytes, resultSHA256)

    Map baselinePilot = validationSummary.baselineFacadeAcceptedRatePilot as Map
    boolean pilotExpected = context.variants.contains('legacy132')
            && context.operationFilter in ['all', 'deposit']
    if ((baselinePilot.available as boolean) != pilotExpected) {
        throw new GradleException('Paired JMH baseline accepted-rate pilot availability does not match the requested matrix.')
    }

    String resultRelativePath = context.resultFileRelativePath as String
    Map hostProvenance = context.hostProvenance as Map
    File measurementSuccessMarkerFile = file(context.measurementSuccessMarkerFile as String).canonicalFile
    Map measurementSuccessMarker = new groovy.json.JsonSlurper().parse(measurementSuccessMarkerFile) as Map
    String markerRelativePath = rootProject.projectDir.toPath().relativize(measurementSuccessMarkerFile.toPath())
            .toString().replace('\\', '/')
    Map manifest = [
            schemaVersion: 2,
            runId: context.runId,
            sourceSHA: context.sourceSHA,
            sourceTreeSHA256: context.sourceTreeSHA256,
            baselineSHA: context.baselineSHA,
            artifactSHA256: context.artifactSHA256,
            profileId: context.profileId,
            jdk: validationSummary.measurementJdk,
            gradleDaemonJdk: context.gradleDaemonJdk,
            baselineBuildJavaVersion: context.baselineBuildJavaVersion,
            gcCollector: context.gcCollector,
            gcJvmFlag: context.gcJvmFlag,
            heapJvmFlag: context.heapJvmFlag,
            measurementJvmArgs: context.measurementJvmArgs,
            observedJvmArgs: validationSummary.observedJvmArgs,
            p999SampleMinimum: context.p999SampleMinimum,
            comparisonType: context.comparisonType,
            sampleTailAssessment: validationSummary.sampleTailAssessment,
            expectedMatrix: context.expectedMatrix,
            reportValidation: [expectedRows: validationSummary.expectedRows,
                    rowCount: validationSummary.rowCount, sampleTimeRows: validationSummary.sampleTimeRows],
            measurementEvidence: [markerFile: markerRelativePath,
                    markerSHA256: sha256(measurementSuccessMarkerFile), marker: measurementSuccessMarker],
            os: hostProvenance.osName + ' ' + hostProvenance.osVersion + ' ' + hostProvenance.osArch,
            availableProcessors: hostProvenance.availableProcessors,
            hostProvenance: hostProvenance,
            resultFile: resultRelativePath,
            resultBytes: validationSummary.resultBytes,
            resultSHA256: validationSummary.resultSHA256,
            baselineFacadeAcceptedRatePilot: baselinePilot,
            producerThreads: context.threadCount,
            notes: [
                    'A p99.9 estimate includes an approximate 95% binomial order-statistic interval only when the sample minimum is met; this interval does not establish independence or cross-fork stationarity.',
                    'The quick smoke is not a tail-latency conclusion.',
                    'Fork affinity is explicitly NOT_CAPTURED; the paired result does not claim affinity parity.',
                    'Paired measurement forks use benchmark-only SerialGC following intermittent HotSpot access violations observed under G1 and ParallelGC; the root cause remains unknown, and both variants share the same collector.',
                    'Measurement forks use a fixed 1 GiB maximum heap for both variants.',
                    'Latency covers synchronous facade acceptance; it does not claim Redis receipt or SQL durability.',
                    'The current facade receipt adapter drains accepted events into deterministic in-memory receipts; synthetic receipt completion is not durable persistence.',
                    'This facade pilot is not a macro Redis/SQL baseline and must not be used to calibrate the open-loop load profile.'
            ]
    ]
    if (context.recoveryProvenance != null) manifest.recoveryProvenance = context.recoveryProvenance

    if (manifestFile.isFile()) {
        runJavaMain.call(validatorJava, sourceSets.jmh.runtimeClasspath.asPath,
                'noietime.syncmoney.benchmark.PairedJmhReportValidator',
                ['verify-binding', resultFile.absolutePath, manifestFile.absolutePath])
        Map existingManifest = new groovy.json.JsonSlurper().parse(manifestFile) as Map
        boolean exactManifestMatch = groovy.json.JsonOutput.toJson(existingManifest)
                == groovy.json.JsonOutput.toJson(manifest)
        if (!exactManifestMatch) {
            def manifestSubsetMatches
            manifestSubsetMatches = { Object existingValue, Object expectedValue, String path ->
                if (path == 'comparisonType' && existingValue == null && expectedValue == 'PAIRED') return true
                if (path == 'measurementEvidence' && context.recoveryProvenance != null
                        && existingValue instanceof Map && expectedValue instanceof Map) {
                    Map oldMeasurement = existingValue as Map
                    Map newMeasurement = expectedValue as Map
                    Map oldMarker = oldMeasurement.marker as Map
                    Map newMarker = newMeasurement.marker as Map
                    Map oldEvidence = oldMarker?.evidence as Map
                    Map newEvidence = newMarker?.evidence as Map
                    List<String> stableMarkerFields = ['markerSchemaVersion', 'measurementOutcome', 'runId',
                            'sourceSHA', 'sourceTreeSHA256', 'resultFileRelativePath', 'resultBytes', 'resultSHA256']
                    List<String> stableEvidenceFields = ['kind', 'originalLog', 'originalLogSHA256', 'originalExit',
                            'originalGradleExitCode', 'originalValidationSummary', 'originalValidationSummarySHA256',
                            'originalValidationSummaryHadReportBinding', 'sourceIdentityManifest',
                            'sourceIdentityManifestSHA256', 'benchmarkJarSHA256Observed',
                            'recoveredReportBytes', 'recoveredReportSHA256']
                    return oldMeasurement.markerFile == newMeasurement.markerFile
                            && oldMeasurement.markerSHA256 instanceof String
                            && (oldMeasurement.markerSHA256 ==~ /[0-9a-f]{64}/)
                            && oldMarker != null && newMarker != null
                            && stableMarkerFields.every { String key ->
                                groovy.json.JsonOutput.toJson(oldMarker.get(key))
                                        == groovy.json.JsonOutput.toJson(newMarker.get(key))
                            }
                            && oldEvidence != null && newEvidence != null
                            && stableEvidenceFields.every { String key ->
                                groovy.json.JsonOutput.toJson(oldEvidence.get(key))
                                        == groovy.json.JsonOutput.toJson(newEvidence.get(key))
                            }
                }
                if (existingValue instanceof Map && expectedValue instanceof Map) {
                    Map existingMap = existingValue as Map
                    Map expectedMap = expectedValue as Map
                    return existingMap.every { Object key, Object value ->
                        expectedMap.containsKey(key) && manifestSubsetMatches.call(value,
                                expectedMap.get(key), path.isEmpty() ? key.toString() : path + '.' + key)
                    }
                }
                if (existingValue instanceof List && expectedValue instanceof List) {
                    return groovy.json.JsonOutput.toJson(existingValue)
                            == groovy.json.JsonOutput.toJson(expectedValue)
                }
                groovy.json.JsonOutput.toJson(existingValue) == groovy.json.JsonOutput.toJson(expectedValue)
            }
            boolean verifiedRecoveryUpgrade = context.recoveryProvenance != null
                    && manifestSubsetMatches.call(existingManifest, manifest, '')
            if (!verifiedRecoveryUpgrade) {
                throw new GradleException('Existing paired JMH manifest does not match the verified run context; refusing overwrite.')
            }
            logger.lifecycle('Upgrading an older recovery manifest after verifying every existing field against the exact result and run context.')
            writeJsonAtomically.call(manifestFile, manifest)
            runJavaMain.call(validatorJava, sourceSets.jmh.runtimeClasspath.asPath,
                    'noietime.syncmoney.benchmark.PairedJmhReportValidator',
                    ['verify-binding', resultFile.absolutePath, manifestFile.absolutePath])
            logger.lifecycle('Upgraded the hash-bound recovery manifest with explicit comparison and measurement evidence: '
                    + manifestFile)
            return
        }
        logger.lifecycle('JMH report is already finalized and matches its verified context: ' + manifestFile)
        return
    }

    File temporaryManifest = new File(manifestFile.parentFile, manifestFile.name + '.tmp')
    writeJsonAtomically.call(temporaryManifest, manifest)
    runJavaMain.call(validatorJava, sourceSets.jmh.runtimeClasspath.asPath,
            'noietime.syncmoney.benchmark.PairedJmhReportValidator',
            ['verify-binding', resultFile.absolutePath, temporaryManifest.absolutePath])
    try {
        java.nio.file.Files.move(temporaryManifest.toPath(), manifestFile.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING, java.nio.file.StandardCopyOption.ATOMIC_MOVE)
    } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
        java.nio.file.Files.move(temporaryManifest.toPath(), manifestFile.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
    runJavaMain.call(validatorJava, sourceSets.jmh.runtimeClasspath.asPath,
            'noietime.syncmoney.benchmark.PairedJmhReportValidator',
            ['verify-binding', resultFile.absolutePath, manifestFile.absolutePath])
    logger.lifecycle('Finalized JMH report rows=' + validationSummary.rowCount
            + ', bytes=' + validationSummary.resultBytes + ', sha256=' + validationSummary.resultSHA256
            + ', manifest=' + manifestFile)
}

def benchmarkProjectPaths = {
    configurations.jmhRuntimeClasspath.incoming.resolutionResult.allComponents
            .findAll { component -> component.id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier }
            .collect { component -> component.id.projectPath }
            .findAll { projectPath -> projectPath != ':' }
            .toSorted()
}

def benchmarkSourceTreeSha256 = {
    List<String> roots = [
            'build.gradle', 'settings.gradle', 'gradle.properties',
            'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml',
            'syncmoney-benchmarks/build.gradle', 'syncmoney-benchmarks/profiles',
            'syncmoney-benchmarks/src/jmh', 'syncmoney-benchmarks/src/loadTest',
            'syncmoney-benchmarks/src/test'
    ]
    Set<File> inputs = new LinkedHashSet<>()
    roots.each { relative ->
        File input = rootProject.file(relative)
        if (input.isFile()) inputs.add(input.canonicalFile)
        else if (input.isDirectory()) inputs.addAll(fileTree(input).files.collect { it.canonicalFile })
    }
    benchmarkProjectPaths.call().each { String projectPath ->
        Project dependencyProject = rootProject.findProject(projectPath)
        if (dependencyProject == null) {
            throw new GradleException('Cannot resolve benchmark project dependency ' + projectPath)
        }
        File buildFile = dependencyProject.buildFile
        if (buildFile.isFile()) inputs.add(buildFile.canonicalFile)
        inputs.addAll(dependencyProject.sourceSets.main.allSource.files.collect { it.canonicalFile })
    }
    File requiredBukkitResource = rootProject.file('src/main/resources/plugin.yml').canonicalFile
    if (benchmarkProjectPaths.call().contains(':syncmoney-bukkit') && !inputs.contains(requiredBukkitResource)) {
        throw new GradleException('Benchmark source fingerprint omitted configured Bukkit main resources: '
                + rootProject.projectDir.toPath().relativize(requiredBukkitResource.toPath()))
    }
    File buildLogic = rootProject.file('buildSrc')
    if (buildLogic.isDirectory()) inputs.addAll(fileTree(buildLogic).files.collect { it.canonicalFile })
    java.security.MessageDigest digest = java.security.MessageDigest.getInstance('SHA-256')
    inputs.sort { left, right ->
        rootProject.projectDir.toPath().relativize(left.toPath()).toString()
                .compareTo(rootProject.projectDir.toPath().relativize(right.toPath()).toString())
    }.each { File input ->
        String relative = rootProject.projectDir.toPath().relativize(input.toPath()).toString().replace('\\', '/')
        digest.update(relative.getBytes('UTF-8'))
        digest.update((byte) 0)
        digest.update(input.bytes)
        digest.update((byte) 0)
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

def loadTestRuntimeClasspathSha256 = { FileCollection runtimeClasspath ->
    List<String> orderedEntries = runtimeClasspath.asPath
            .split(java.util.regex.Pattern.quote(File.pathSeparator))
            .findAll { !it.isEmpty() }
    if (orderedEntries.isEmpty()) throw new GradleException('Load-test runtime classpath is empty.')

    java.security.MessageDigest digest = java.security.MessageDigest.getInstance('SHA-256')
    orderedEntries.eachWithIndex { String path, int index ->
        File entry = file(path).canonicalFile
        String kind = !entry.exists() ? 'missing' : (entry.isDirectory() ? 'directory' : 'file')
        digest.update((index + ':' + kind + ':' + entry.name).getBytes('UTF-8'))
        digest.update((byte) 0)
        if (!entry.exists()) {
            // Source sets may contribute an empty resources directory that Gradle has not created.
            digest.update((byte) 0)
        } else if (entry.isDirectory()) {
            List<File> contents = fileTree(entry).files.sort { left, right ->
                entry.toPath().relativize(left.toPath()).toString().replace('\\', '/')
                        .compareTo(entry.toPath().relativize(right.toPath()).toString().replace('\\', '/'))
            }
            digest.update(contents.size().toString().getBytes('UTF-8'))
            digest.update((byte) 0)
            contents.each { File content ->
                String relative = entry.toPath().relativize(content.toPath()).toString().replace('\\', '/')
                digest.update(relative.getBytes('UTF-8'))
                digest.update((byte) 0)
                digest.update(sha256(content).getBytes('UTF-8'))
                digest.update((byte) 0)
            }
        } else if (entry.isFile()) {
            digest.update(entry.length().toString().getBytes('UTF-8'))
            digest.update((byte) 0)
            digest.update(sha256(entry).getBytes('UTF-8'))
        } else {
            throw new GradleException('Unsupported load-test classpath entry: ' + entry.name)
        }
        digest.update((byte) 0)
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

tasks.register('verifyBenchmarkProvenance') {
    group = 'verification'
    description = 'Verifies deterministic source and actual load-test runtime classpath fingerprints.'
    dependsOn tasks.named('loadTestClasses')
    doLast {
        List<String> projectPaths = benchmarkProjectPaths.call()
        List<String> requiredProjects = [':syncmoney-api', ':syncmoney-sync']
        List<String> missingProjects = requiredProjects.findAll { !projectPaths.contains(it) }
        if (!missingProjects.isEmpty()) {
            throw new GradleException('Benchmark source fingerprint omitted transitive projects: ' + missingProjects)
        }
        String sourceFirst = benchmarkSourceTreeSha256.call()
        String sourceSecond = benchmarkSourceTreeSha256.call()
        String classpathFirst = loadTestRuntimeClasspathSha256.call(sourceSets.loadTest.runtimeClasspath)
        String classpathSecond = loadTestRuntimeClasspathSha256.call(sourceSets.loadTest.runtimeClasspath)
        if (sourceFirst != sourceSecond || classpathFirst != classpathSecond) {
            throw new GradleException('Benchmark provenance fingerprints are not deterministic.')
        }
        int classpathEntries = sourceSets.loadTest.runtimeClasspath.asPath
                .split(java.util.regex.Pattern.quote(File.pathSeparator)).findAll { !it.isEmpty() }.size()
        logger.lifecycle('benchmarkSourceTreeSHA256=' + sourceFirst)
        logger.lifecycle('loadTestRuntimeClasspathSHA256=' + classpathFirst)
        logger.lifecycle('loadTestRuntimeClasspathEntries=' + classpathEntries)
        logger.lifecycle('benchmarkProjectDependencies=' + projectPaths.join(','))
    }
}

def prepareVerifiedBaseline = { File baseline ->
    String baselineRoot = captureOutput(['git', '-C', baseline.absolutePath, 'rev-parse', '--show-toplevel'])
    String baselineSha = captureOutput(['git', '-C', baseline.absolutePath, 'rev-parse', 'HEAD'])
    String dirty = captureOutput(['git', '-C', baseline.absolutePath, 'status', '--porcelain'])
    if (file(baselineRoot).canonicalFile != baseline || baselineSha != '71cc55dfeefe9a8f40a3835b051ddd324d353767'
            || !dirty.isEmpty()) {
        throw new GradleException('baselineCheckout must be a clean isolated checkout at verified 1.3.2 SHA '
                + '71cc55dfeefe9a8f40a3835b051ddd324d353767; observed SHA=' + baselineSha
                + ', status=' + (dirty.isEmpty() ? 'clean' : 'dirty'))
    }

    File baselineJavaHome = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }.get().metadata.installationPath.asFile
    boolean windows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
    File baselineJava = new File(baselineJavaHome, "bin${File.separator}java${windows ? '.exe' : ''}")
    File wrapperJar = new File(baseline, 'gradle/wrapper/gradle-wrapper.jar')
    if (!baselineJava.isFile() || !wrapperJar.isFile()) {
        throw new GradleException('Verified 1.3.2 baseline needs its Java 21 launcher and Gradle wrapper JAR.')
    }
    String javaVersionOutput = runProcess.call([baselineJava.absolutePath, '-version'], baseline, [:])
    def versionMatch = javaVersionOutput =~ /(?m)^(?:openjdk|java) version "(21[^\"]*)"/
    if (!versionMatch.find()) {
        throw new GradleException('Verified baseline launcher did not report Java 21.')
    }
    String baselineBuildJavaVersion = versionMatch.group(1)
    String baselineBuildOutput = runProcess.call([
            baselineJava.absolutePath, '-classpath', wrapperJar.absolutePath,
            'org.gradle.wrapper.GradleWrapperMain', '--no-daemon', '--no-build-cache', '--rerun-tasks',
            '--console', 'plain', 'shadowJar'
    ], baseline, [
            JAVA_HOME: baselineJavaHome.absolutePath,
            PATH: new File(baselineJavaHome, 'bin').absolutePath + File.pathSeparator + System.getenv('PATH')
    ])
    logger.lifecycle(baselineBuildOutput)
    File baselineArtifact = new File(baseline, 'build/libs/Syncmoney-1.3.2.jar')
    if (!baselineArtifact.isFile()) throw new GradleException('Baseline Java 21 build did not produce ' + baselineArtifact)
    [baselineSha: baselineSha, artifact: baselineArtifact,
            artifactSha256: sha256(baselineArtifact), buildJavaVersion: baselineBuildJavaVersion]
}

def comparison = [:]
tasks.register('runBaselineComparison', JavaExec) {
    group = 'benchmark'
    description = 'Builds the verified 1.3.2 baseline artifact and runs paired transaction benchmarks.'
    dependsOn tasks.named('benchmarkJar')
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    doFirst {
        def baselineProperty = providers.gradleProperty('baselineCheckout').orNull
        if (baselineProperty == null || baselineProperty.isBlank()) {
            throw new GradleException('Supply -PbaselineCheckout=<verified isolated 1.3.2 worktree>.')
        }
        File baseline = rootProject.file(baselineProperty).canonicalFile
        if (!baseline.isDirectory() || baseline == rootProject.projectDir.canonicalFile) {
            throw new GradleException('baselineCheckout must be an existing isolated checkout, not this project.')
        }

        def baselineBuild = prepareVerifiedBaseline.call(baseline)
        String baselineSha = baselineBuild.baselineSha
        File baselineArtifact = baselineBuild.artifact
        File reportDir = layout.buildDirectory.dir('reports/benchmarks').get().asFile
        reportDir.mkdirs()
        String runId = UUID.randomUUID().toString()
        def threadCount = providers.gradleProperty('benchmarkThreads').orElse('1').get()
        if (!(threadCount in ['1', '2', '8'])) {
            throw new GradleException('benchmarkThreads must be one of the planned producer counts: 1, 2, or 8.')
        }
        def variants = providers.gradleProperty('benchmarkVariants').orElse('current,legacy132').get()
        if (variants.split(',').toList().any { !(it in ['current', 'legacy132']) }
                || variants.split(',').toList().toSet().size() != variants.split(',').length) {
            throw new GradleException('benchmarkVariants must be a unique comma-separated subset of current,legacy132.')
        }
        def benchmarkOperation = providers.gradleProperty('benchmarkOperation').orNull
        if (benchmarkOperation != null && !(benchmarkOperation in ['balance', 'deposit', 'withdraw', 'set',
                'transfer', 'reject-withdraw', 'cancel-deposit', 'cancel-withdraw'])) {
            throw new GradleException('benchmarkOperation must name a supported TransactionBenchmarks operation.')
        }
        boolean quick = providers.gradleProperty('benchmarkQuick').isPresent()
        File resultFile = new File(reportDir, 'transaction-paired-jmh-t' + threadCount + '-' + runId + '.json')
        File validationSummaryFile = new File(layout.buildDirectory.dir('tmp').get().asFile,
                'transaction-paired-validation-' + runId + '.json')
        File runContextFile = new File(layout.buildDirectory.dir('tmp').get().asFile,
                'transaction-paired-context-' + runId + '.json')
        File manifestFile = new File(reportDir,
                'transaction-paired-manifest-t' + threadCount + '-' + runId + '.json')
        File measurementSuccessMarkerFile = new File(layout.buildDirectory.dir('tmp').get().asFile,
                'transaction-paired-success-' + runId + '.json')
        String candidateSha = captureOutput.call(['git', '-C', rootProject.projectDir.absolutePath, 'rev-parse', 'HEAD'])
        String sourceTreeSha256 = benchmarkSourceTreeSha256.call()
        File benchmarkArtifact = tasks.named('benchmarkJar').get().archiveFile.get().asFile
        def resultRelativePath = rootProject.projectDir.toPath().relativize(resultFile.toPath())
                .toString().replace('\\', '/')
        def expectedMatrix = [
                variants: variants.split(',').toList(),
                operation: benchmarkOperation ?: (quick ? 'deposit' : 'all'),
                accountCounts: quick ? ['1000'] : ['1', '1000', '10000'],
                accessPatterns: quick ? ['uniform'] : ['uniform', 'hot'],
                modes: ['thrpt', 'sample'],
                producerThreads: Integer.parseInt(threadCount),
                forks: quick ? 1 : 3,
                measurementIterations: quick ? 1 : 10
        ]
        int operationCount = quick || benchmarkOperation != null ? 1 : 8
        int expectedRows = variants.split(',').length * operationCount
                * (quick ? 1 : 3) * (quick ? 1 : 2) * 2
        String comparisonType = variants.split(',').length == 2 ? 'PAIRED' : 'SINGLE_VARIANT_DIAGNOSTIC'
        String profileId = comparisonType == 'PAIRED'
                ? 'transaction-paired-jmh' : 'transaction-single-variant-diagnostic-jmh'
        Map hostProvenance = captureHostProvenance.call()
        comparison.putAll([
                baseline: baseline,
                baselineSha: baselineSha,
                baselineArtifact: baselineArtifact,
                baselineArtifactSha256: baselineBuild.artifactSha256,
                benchmarkArtifact: benchmarkArtifact,
                benchmarkArtifactSha256: sha256(benchmarkArtifact),
                sourceSHA: candidateSha,
                sourceTreeSHA256: sourceTreeSha256,
                resultFile: resultFile,
                resultFileRelativePath: resultRelativePath,
                reportDir: reportDir,
                manifestFile: manifestFile,
                threadCount: Integer.parseInt(threadCount),
                variants: variants.split(',').toList(),
                benchmarkOperation: benchmarkOperation,
                quick: quick,
                expectedForks: quick ? 1 : 3,
                expectedMeasurementIterations: quick ? 1 : 10,
                expectedRows: expectedRows,
                expectedMatrix: expectedMatrix,
                validationSummaryFile: validationSummaryFile,
                measurementSuccessMarkerFile: measurementSuccessMarkerFile,
                hostProvenance: hostProvenance,
                runContextFile: runContextFile,
                runId: runId,
                baselineBuildJavaVersion: baselineBuild.buildJavaVersion
        ])
        systemProperty 'syncmoney.benchmarks.baselineArtifact', baselineArtifact.canonicalPath
        systemProperty 'syncmoney.benchmarks.baselineSha', baselineSha
        systemProperty 'syncmoney.benchmarks.baselineArtifactSha256', comparison.baselineArtifactSha256

        if (providers.gradleProperty('benchmarkQuick').isPresent()) {
                args 'noietime.syncmoney.benchmark.TransactionBenchmarks',
                        '-p', 'variant=' + comparison.variants.join(','), '-p', 'accountCount=1000', '-p', 'accessPattern=uniform',
                        '-p', 'operation=' + (benchmarkOperation ?: 'deposit'), '-t', threadCount, '-wi', '1', '-i', '1', '-w', '200ms', '-r', '200ms', '-f', '1',
                        '-jvmArgsAppend', pairedJmhMeasurementProfile.jmhJvmArgs.join(' '),
                        '-rf', 'json', '-rff', resultFile.absolutePath
        } else {
            args 'noietime.syncmoney.benchmark.TransactionBenchmarks',
                    '-p', 'variant=' + comparison.variants.join(','),
                    '-t', threadCount, '-wi', '5', '-i', '10', '-w', '1s', '-r', '1s', '-f', '3', '-prof', 'gc',
                    '-jvmArgsAppend', pairedJmhMeasurementProfile.jmhJvmArgs.join(' '),
                    '-rf', 'json', '-rff', resultFile.absolutePath
            if (benchmarkOperation != null) args '-p', 'operation=' + benchmarkOperation
        }

        Map runContext = [
                contextSchemaVersion: 1,
                runId: runId,
                sourceSHA: candidateSha,
                sourceTreeSHA256: sourceTreeSha256,
                baselineSHA: baselineSha,
                artifactSHA256: [benchmarkJar: comparison.benchmarkArtifactSha256,
                        baselineJar: baselineBuild.artifactSha256],
                profileId: profileId,
                comparisonType: comparisonType,
                gradleDaemonJdk: System.getProperty('java.version'),
                baselineBuildJavaVersion: baselineBuild.buildJavaVersion,
                gcCollector: pairedJmhMeasurementProfile.collector,
                gcJvmFlag: pairedJmhMeasurementProfile.gcJvmFlag,
                heapJvmFlag: pairedJmhMeasurementProfile.heapJvmFlag,
                measurementJvmArgs: pairedJmhMeasurementProfile.jmhJvmArgs,
                p999SampleMinimum: 100000,
                expectedMatrix: expectedMatrix,
                expectedRows: expectedRows,
                hostProvenance: hostProvenance,
                threadCount: Integer.parseInt(threadCount),
                variants: comparison.variants,
                operationFilter: benchmarkOperation ?: 'all',
                quick: quick,
                expectedForks: comparison.expectedForks,
                expectedMeasurementIterations: comparison.expectedMeasurementIterations,
                resultFile: resultFile.absolutePath,
                resultFileRelativePath: resultRelativePath,
                validationSummaryFile: validationSummaryFile.absolutePath,
                manifestFile: manifestFile.absolutePath,
                measurementSuccessMarkerFile: measurementSuccessMarkerFile.absolutePath,
                runContextFile: runContextFile.absolutePath,
                startedAtUtc: java.time.Instant.now().toString()
        ]
        comparison.runContext = runContext
        writeJsonAtomically.call(runContextFile, runContext)
    }
    doLast {
        recordMeasurementSuccess.call(comparison.runContext as Map)
    }
    doLast {
        finalizeComparisonReport.call(comparison.runContext as Map)
    }
}

tasks.register('finalizePairedComparisonReport') {
    group = 'verification'
    description = 'Revalidates an existing JMH report and creates its hash-bound manifest without rerunning measurements.'
    dependsOn tasks.named('jmhClasses'), configurations.jmhRuntimeClasspath.buildDependencies
    doLast {
        def contextProperty = providers.gradleProperty('pairedReportContext').orNull
        if (contextProperty == null || contextProperty.isBlank()) {
            throw new GradleException('Supply -PpairedReportContext=<persisted paired run context JSON>.')
        }
        File contextFile = rootProject.file(contextProperty).canonicalFile
        if (!contextFile.isFile()) throw new GradleException('Paired JMH run context does not exist: ' + contextFile)
        Map context = new groovy.json.JsonSlurper().parse(contextFile) as Map
        if ((context.contextSchemaVersion as int) != 1) {
            throw new GradleException('Unsupported paired JMH run-context schema version.')
        }
        if (context.runContextFile != null
                && rootProject.file(context.runContextFile as String).canonicalFile != contextFile) {
            throw new GradleException('Paired JMH runContextFile does not identify the supplied context file.')
        }
        context.runContextFile = contextFile.absolutePath
        finalizeComparisonReport.call(context)
    }
}

tasks.register('runBaselineMacroPilot', JavaExec) {
    group = 'benchmark'
    description = 'Builds the verified 1.3.2 baseline with Java 21 and measures its isolated Redis/SQL macro path on Java 25.'
    dependsOn tasks.named('loadTestClasses')
    classpath = sourceSets.loadTest.runtimeClasspath
    mainClass = 'noietime.syncmoney.benchmark.load.BaselineMacroPilotProducer'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    maxHeapSize = '1g'
    jvmArgs redisSqlMeasurementProfile.gcJvmFlag
    systemProperty 'net.bytebuddy.experimental', 'true'
    doFirst {
        def baselineProperty = providers.gradleProperty('baselineCheckout').orNull
        if (baselineProperty == null || baselineProperty.isBlank()) {
            throw new GradleException('Supply -PbaselineCheckout=<verified isolated 1.3.2 worktree>.')
        }
        def profileProperty = providers.gradleProperty('profile').orNull
        if (profileProperty == null || profileProperty.isBlank()) {
            throw new GradleException('Supply -Pprofile=<path-to-open-loop-profile.json>.')
        }
        File baseline = rootProject.file(baselineProperty).canonicalFile
        if (!baseline.isDirectory() || baseline == rootProject.projectDir.canonicalFile) {
            throw new GradleException('baselineCheckout must be an existing isolated checkout, not this project.')
        }
        File profileFile = rootProject.file(profileProperty).canonicalFile
        if (!profileFile.isFile()) throw new GradleException('profile must point to an existing benchmark profile JSON file.')

        def baselineBuild = prepareVerifiedBaseline.call(baseline)
        File outputFile = rootProject.file(providers.gradleProperty('baselinePilotOutput')
                .orElse('build/reports/benchmarks/baseline-macro-pilot.json').get()).canonicalFile
        outputFile.parentFile.mkdirs()
        String runId = UUID.randomUUID().toString()
        File attestationFile = new File(outputFile.parentFile, outputFile.name + '.build-' + runId + '.json')
        attestationFile.text = groovy.json.JsonOutput.toJson([
                schemaVersion: 1,
                baselineSHA: baselineBuild.baselineSha,
                baselineArtifactSHA256: baselineBuild.artifactSha256,
                baselineBuildJavaVersion: baselineBuild.buildJavaVersion
        ]) + System.lineSeparator()

        args '--baseline-checkout', baseline.absolutePath,
                '--baseline-artifact', baselineBuild.artifact.absolutePath,
                '--baseline-build-attestation', attestationFile.absolutePath,
                '--profile', profileFile.absolutePath,
                '--output', outputFile.absolutePath
        systemProperty 'syncmoney.benchmarks.sourceSha', captureOutput(['git', '-C', rootProject.projectDir.absolutePath, 'rev-parse', 'HEAD'])
        systemProperty 'syncmoney.benchmarks.sourceTreeSha256', benchmarkSourceTreeSha256.call()
        systemProperty 'syncmoney.benchmarks.loadTestRuntimeClasspathSha256',
                loadTestRuntimeClasspathSha256.call(classpath)
        logger.lifecycle('baselineBuildAttestation=' + attestationFile.absolutePath)
    }
}

tasks.register('loadTest', JavaExec) {
    group = 'benchmark'
    description = 'Runs a bounded open-loop Redis/SQL load profile with arrival-to-response histograms.'
    dependsOn tasks.named('loadTestClasses')
    classpath = sourceSets.loadTest.runtimeClasspath
    mainClass = 'noietime.syncmoney.benchmark.load.OpenLoopLoadRunner'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    maxHeapSize = '1g'
    jvmArgs redisSqlMeasurementProfile.gcJvmFlag
    systemProperty 'net.bytebuddy.experimental', 'true'
    doFirst {
        def profile = providers.gradleProperty('profile').orNull
        if (profile == null || profile.isBlank()) {
            throw new GradleException('Supply -Pprofile=<path-to-open-loop-profile.json>.')
        }
        def baselinePilotProperty = providers.gradleProperty('baselinePilot').orNull
        if (baselinePilotProperty == null || baselinePilotProperty.isBlank()) {
            throw new GradleException('Supply -PbaselinePilot=<hash-bound 1.3.2 Redis/SQL macro-pilot JSON>; facade/JMH rates are not valid calibration inputs.')
        }
        def baselineProperty = providers.gradleProperty('baselineCheckout').orNull
        if (baselineProperty == null || baselineProperty.isBlank()) {
            throw new GradleException('Supply -PbaselineCheckout=<verified isolated 1.3.2 worktree> for report provenance.')
        }
        File baseline = rootProject.file(baselineProperty).canonicalFile
        if (!baseline.isDirectory() || baseline == rootProject.projectDir.canonicalFile) {
            throw new GradleException('baselineCheckout must be an existing isolated checkout, not this project.')
        }
        def baselineBuild = prepareVerifiedBaseline.call(baseline)
        File baselinePilot = rootProject.file(baselinePilotProperty).canonicalFile
        if (!baselinePilot.isFile()) throw new GradleException('baselinePilot must point to an existing macro-pilot JSON file.')
        systemProperty 'syncmoney.benchmarks.baselineSha', baselineBuild.baselineSha
        systemProperty 'syncmoney.benchmarks.baselineJarSha256', baselineBuild.artifactSha256
        systemProperty 'syncmoney.benchmarks.baselineBuildJavaVersion', baselineBuild.buildJavaVersion
        systemProperty 'syncmoney.benchmarks.baselineMacroPilotSha256', sha256(baselinePilot)
        File profileFile = rootProject.file(profile).canonicalFile
        if (!profileFile.isFile()) throw new GradleException('profile must point to an existing benchmark profile JSON file.')
        args profileFile.canonicalPath
        args '--baseline-pilot', baselinePilot.canonicalPath
        systemProperty 'syncmoney.benchmarks.sourceSha', captureOutput(['git', '-C', rootProject.projectDir.absolutePath, 'rev-parse', 'HEAD'])
        systemProperty 'syncmoney.benchmarks.sourceTreeSha256', benchmarkSourceTreeSha256.call()
        systemProperty 'syncmoney.benchmarks.loadTestRuntimeClasspathSha256',
                loadTestRuntimeClasspathSha256.call(classpath)
    }
}
