plugins {
    id 'java-library'
    id 'jacoco'
}

group = rootProject.group
version = rootProject.version

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
    }
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        name = 'extendedclip'
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
    maven {
        name = 'codemc-creatorfromhell'
        url = 'https://repo.codemc.io/repository/creatorfromhell/'
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.toVersion(25)
    targetCompatibility = JavaVersion.toVersion(25)
}

sourceSets {
    main {
        resources.srcDir rootProject.file('src/main/resources')
    }
}

dependencies {
    def paperApiVersion = rootProject.ext.paperApiVersion
    implementation project(':syncmoney-api')
    implementation project(':syncmoney-core')
    implementation project(':syncmoney-protocol')
    implementation project(':syncmoney-storage')
    implementation project(':syncmoney-sync')

    compileOnly "io.papermc.paper:paper-api:${paperApiVersion}"
    compileOnly 'net.milkbowl.vault:VaultUnlockedAPI:2.20'
    compileOnly 'me.clip:placeholderapi:2.12.3'
    compileOnly 'net.kyori:adventure-text-minimessage:4.16.0'
    compileOnly 'net.kyori:adventure-text-serializer-ansi:4.16.0'

    implementation 'redis.clients:jedis:5.2.0'
    implementation 'org.apache.commons:commons-pool2:2.13.1'
    implementation 'com.zaxxer:HikariCP:6.2.1'
    implementation 'com.mysql:mysql-connector-j:9.2.0'
    implementation 'org.postgresql:postgresql:42.7.14'
    implementation 'org.xerial:sqlite-jdbc:3.54.1.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'
    implementation 'org.bstats:bstats-bukkit:3.2.1'
    implementation 'io.undertow:undertow-core:2.4.4.Final'
    implementation 'io.undertow:undertow-websockets-jsr:2.3.27.Final'
    implementation 'io.undertow:undertow-servlet:2.3.27.Final'
    implementation 'org.yaml:snakeyaml:2.7'

    testImplementation "io.papermc.paper:paper-api:${paperApiVersion}"
    testImplementation 'net.milkbowl.vault:VaultUnlockedAPI:2.20'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'net.bytebuddy:byte-buddy:1.18.17'
    testImplementation 'net.bytebuddy:byte-buddy-agent:1.18.17'
    testRuntimeOnly 'net.kyori:adventure-text-minimessage:4.16.0'
    testRuntimeOnly 'net.kyori:adventure-text-serializer-ansi:4.16.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
}

tasks.named('test') {
    useJUnitPlatform()
    dependsOn rootProject.tasks.named('shadowJar')
    systemProperty 'syncmoney.shadowJar',
            rootProject.layout.buildDirectory.file('libs/Syncmoney-' + rootProject.version + '.jar').get().asFile.absolutePath
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('processResources') {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('paper-plugin.yml') { expand props }
    filesMatching('plugin.yml') { expand props }
    filesMatching('syncmoney-version.properties') { expand props }
    filesMatching('lua/*.lua') { duplicatesStrategy = DuplicatesStrategy.INCLUDE }

    doLast {
        def webDir = rootProject.file('src/main/resources/syncmoney-web')
        if (webDir.exists()) {
            copy {
                from webDir
                into layout.buildDirectory.dir('resources/main/syncmoney-web')
            }
        }
    }
}
