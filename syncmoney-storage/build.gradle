plugins { id 'java-library' }
repositories { mavenCentral() }
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
dependencies {
    api project(':syncmoney-core')
    testImplementation testFixtures(project(':syncmoney-testkit'))
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.xerial:sqlite-jdbc:3.54.1.0'
}
test {
    useJUnitPlatform()
}
sourceSets {
    integrationTest {
        java.srcDir file('src/integrationTest/java')
        resources.srcDir file('src/integrationTest/resources')
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}
configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}
dependencies {
    integrationTestImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    integrationTestImplementation testFixtures(project(':syncmoney-testkit'))
    integrationTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    integrationTestRuntimeOnly 'org.postgresql:postgresql:42.7.14'
    integrationTestRuntimeOnly 'com.mysql:mysql-connector-j:9.2.0'
    integrationTestRuntimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.3'
    integrationTestRuntimeOnly 'org.xerial:sqlite-jdbc:3.54.1.0'
}
tasks.register('integrationTest', Test) {
    description = 'Runs real PostgreSQL, MySQL, and MariaDB persistence tests.'
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    ['postgresql', 'mysql', 'mariadb'].each { backend ->
        def prefix = 'SYNCMONEY_TEST_' + backend.toUpperCase()
        systemProperty('syncmoney.test.' + backend + '.url', System.getenv(prefix + '_URL') ?: '')
        systemProperty('syncmoney.test.' + backend + '.user', System.getenv(prefix + '_USER') ?: '')
        systemProperty('syncmoney.test.' + backend + '.password', System.getenv(prefix + '_PASSWORD') ?: '')
    }
}
