version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Taipei
    labels:
      - dependencies
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /syncmoney-web
    schedule:
      interval: weekly
      day: monday
      time: '09:15'
      timezone: Asia/Taipei
    labels:
      - dependencies
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: Asia/Taipei
    labels:
      - dependencies
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
