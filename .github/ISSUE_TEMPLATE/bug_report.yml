name: Bug report
description: Report a reproducible Syncmoney problem.
title: "[Bug]: "
labels:
  - "type: bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove API keys, database credentials, Redis passwords, RCON secrets, player IPs, and other sensitive data before posting logs or configuration.

  - type: input
    id: syncmoney-version
    attributes:
      label: Syncmoney version
      description: Paste the output of `/syncmoney version` or the exact JAR version.
      placeholder: "1.3.1"
    validations:
      required: true

  - type: dropdown
    id: server-software
    attributes:
      label: Server software
      options:
        - Paper
        - Folia
        - Canvas
        - Other
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: Server version
      placeholder: "Paper 1.21.x build ..."
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: "21.0.x or 25.0.x"
    validations:
      required: true

  - type: textarea
    id: integrations
    attributes:
      label: Relevant integrations
      description: List Vault/VaultUnlocked, Redis, SQL database, CMI, PlaceholderAPI, proxy/network topology, or other components involved.

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence that reproduces the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized logs and configuration
      description: Include the relevant log excerpt and configuration sections after removing all secrets and private data.
      render: shell

  - type: checkboxes
    id: sensitive-data
    attributes:
      label: Sensitive data check
      options:
        - label: I removed credentials, API keys, tokens, passwords, private addresses, and other sensitive data from this report.
          required: true
