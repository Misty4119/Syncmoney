name: Compatibility or integration report
description: Report a problem specific to a server platform, economy provider, database, proxy, or optional integration.
title: "[Compatibility]: "
labels:
  - "type: compatibility"
body:
  - type: input
    id: syncmoney-version
    attributes:
      label: Syncmoney version
      description: Paste the output of `/syncmoney version` or the exact JAR version.
      placeholder: "1.3.2"
    validations:
      required: true

  - type: input
    id: server
    attributes:
      label: Server software and version
      placeholder: "Folia 1.21.x build ..."
    validations:
      required: true

  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: "21.0.x or 25.0.x"
    validations:
      required: true

  - type: textarea
    id: stack
    attributes:
      label: Integration stack
      description: List the Vault provider, Redis version, SQL database, proxy, CMI/PlaceholderAPI version, and any other relevant integration.
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Observed compatibility problem
      description: Explain what fails, where it fails, and whether the same setup worked with another version.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include relevant logs and configuration after removing secrets and private data.
      render: shell

  - type: checkboxes
    id: sensitive-data
    attributes:
      label: Sensitive data check
      options:
        - label: I removed credentials, API keys, tokens, passwords, private addresses, and other sensitive data from this report.
          required: true
