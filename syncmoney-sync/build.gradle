plugins { id 'java-library' }
repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven {
        name = 'codemc-creatorfromhell'
        url = 'https://repo.codemc.io/repository/creatorfromhell/'
    }
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }

sourceSets {
    integrationTest {
        java.srcDir file('src/integrationTest/java')
        resources.srcDir rootProject.file('syncmoney-protocol/src/main/resources/lua')
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    def paperApiVersion = rootProject.ext.paperApiVersion
    implementation project(':syncmoney-core')
    implementation project(':syncmoney-protocol')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    integrationTestImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    integrationTestImplementation(testFixtures(project(':syncmoney-testkit'))) {
        exclude group: 'org.xerial', module: 'sqlite-jdbc'
    }
    integrationTestImplementation 'redis.clients:jedis:5.2.0'
    integrationTestImplementation project(':syncmoney-core')
    integrationTestImplementation project(':syncmoney-storage')
    integrationTestImplementation project(':syncmoney-bukkit')
    integrationTestImplementation 'com.zaxxer:HikariCP:6.2.1'
    integrationTestImplementation "io.papermc.paper:paper-api:${paperApiVersion}"
    integrationTestImplementation 'org.mockito:mockito-core:5.24.0'
    integrationTestImplementation 'net.bytebuddy:byte-buddy:1.18.17'
    integrationTestImplementation 'net.bytebuddy:byte-buddy-agent:1.18.17'
    integrationTestRuntimeOnly 'net.milkbowl.vault:VaultUnlockedAPI:2.20'
    integrationTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
}

test {
    useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
    description = 'Runs Redis Lua mutation safety and execution ambiguity tests on isolated Redis processes.'
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
}
